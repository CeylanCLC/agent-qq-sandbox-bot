<section class="page-heading"><div><p class="eyebrow">YOUR PRIVATE WORKSPACE</p><h1>跨设备粘贴板</h1><p class="sub">保存一段文字，换个设备继续。仅管理员可见。</p></div><button class="button primary" id="new-clip" type="button">＋ 新建内容</button></section>
<div class="clip-grid"><section class="panel"><div class="panel-head"><h2>最近保存 <span id="clip-count" class="muted"></span></h2><span id="sync-status" class="clip-sync" aria-live="polite">连接中</span></div><div id="clip-list" class="clip-list"></div><div class="clip-helper">每 5 秒检查更新 · 最多 100 条<br>过期内容不可再访问，下次访问时清理。</div></section>
<section class="panel"><div class="panel-head"><h2 id="editor-heading">新建内容</h2><span class="pill">PRIVATE</span></div><form class="clip-form" id="clip-form"><label for="clip-title">标题（可选）</label><input id="clip-title" maxlength="80" placeholder="例如：待办、链接、代码片段" autocomplete="off"><label for="clip-text">内容</label><textarea id="clip-text" placeholder="在这里粘贴文字或链接…" required spellcheck="false"></textarea><div class="clip-meta"><span id="byte-count">0 / 65536 字节</span><span id="revision-label">尚未保存</span></div><div id="conflict" class="clip-conflict" hidden>其他设备有新版本，你的输入未被覆盖。<br><button type="button" id="load-latest" class="button">放弃本地修改，加载最新</button></div><label for="clip-ttl">保存后有效期</label><select id="clip-ttl"><option value="3600">1 小时</option><option value="86400" selected>24 小时</option><option value="604800">7 天</option></select><div class="clip-buttons"><button type="submit" id="save-clip" class="button primary">保存并同步</button><button type="button" id="copy-clip" class="button">复制内容</button><button type="button" id="paste-clip" class="button">从剪贴板粘贴</button><button type="button" id="save-copy" class="button">另存为新条目</button><button type="button" id="delete-clip" class="button danger" hidden>删除</button></div><p id="clip-status" class="clip-status" role="status"></p></form><div class="clip-helper">不会自动读取系统剪贴板；复制和粘贴需主动点击。内容存储在你的服务器，不是端到端加密保险箱，请勿长期保存密码或密钥。</div></section></div>
<script>
(()=>{'use strict';const csrf={{csrf|tojson}},$=id=>document.getElementById(id);let current=null,dirty=false,busy=false,loadingList=false,selectSeq=0,loginExpired=false;
const fields=['clip-title','clip-text','clip-ttl'];const fmt=t=>new Date(t*1000).toLocaleString('zh-CN',{hour12:false});
function notice(msg,error=false){$('clip-status').textContent=msg;$('clip-status').classList.toggle('failure',error)}
function count(){$('byte-count').textContent=new TextEncoder().encode($('clip-text').value).length+' / 65536 字节'}
async function api(path='',method='GET',data){const r=await fetch('/admin/api/clipboard'+path,{method,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:data===undefined?undefined:JSON.stringify(data),signal:AbortSignal.timeout(10000)});let x;try{x=await r.json()}catch{x={error:'请求失败：'+r.status}}if(!r.ok){if(r.status===401){loginExpired=true;$('sync-status').textContent='登录已过期';notice('登录已过期。请另开标签页登录，当前输入请先复制保存。',true)}const e=new Error(x.error||'请求失败');e.status=r.status;throw e}return x}
function populate(item){current=item;dirty=false;$('clip-title').value=item?.title||'';$('clip-text').value=item?.text||'';$('clip-ttl').value='86400';$('editor-heading').textContent=item?'编辑内容':'新建内容';$('revision-label').textContent=item?'版本 '+item.revision+' · '+fmt(item.updated):'尚未保存';$('delete-clip').hidden=!item;$('conflict').hidden=true;count()}
async function select(id){if(busy)return;if(dirty&&!confirm('当前输入尚未保存，是否放弃？'))return;const seq=++selectSeq;try{const x=await api('/'+id);if(seq!==selectSeq)return;populate(x.item);notice('已加载最新内容');await refresh()}catch(e){notice(e.message,true)}}
async function refresh(){if(loadingList||loginExpired)return;loadingList=true;try{const x=await api();$('clip-count').textContent='('+x.items.length+')';$('clip-list').replaceChildren();for(const item of x.items){const b=document.createElement('button');b.type='button';b.className='clip-entry'+(current?.id===item.id?' selected':'');const title=document.createElement('strong');title.textContent=item.title||'未命名内容';const p=document.createElement('p');p.textContent=item.preview;const small=document.createElement('small');small.textContent=fmt(item.updated)+' · '+fmt(item.expires)+' 到期';b.append(title,p,small);b.onclick=()=>select(item.id);$('clip-list').append(b)}if(!x.items.length){const p=document.createElement('div');p.className='clip-empty';p.textContent='还没有保存内容。在右侧新建第一条。';$('clip-list').append(p)}if(current){const item=x.items.find(r=>r.id===current.id);if(!item||item.revision!==current.revision){$('conflict').hidden=false;notice(item?'其他设备已更新此内容；本地输入保持不变。':'此内容已过期或在其他设备删除，可另存为新条目。',true)}}$('sync-status').textContent='已同步 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch(e){$('sync-status').textContent=loginExpired?'需重新登录':'同步失败';notice(e.message,true)}finally{loadingList=false}}
async function save(asNew=false){if(busy)return;const text=$('clip-text').value;if(!text.trim()){notice('请先输入内容',true);return}if(new TextEncoder().encode(text).length>65536){notice('内容超过 64 KiB，请缩短后再保存',true);return}busy=true;fields.forEach(k=>$(k).disabled=true);$('save-clip').disabled=true;try{const data={title:$('clip-title').value,text,ttl:Number($('clip-ttl').value)};if(current&&!asNew)data.revision=current.revision;const x=await api(current&&!asNew?'/'+current.id:'',current&&!asNew?'PUT':'POST',data);populate(x.item);notice('已保存，其他设备将在 5 秒内看到更新。');await refresh()}catch(e){if(e.status===409)$('conflict').hidden=false;notice(e.message,true)}finally{busy=false;fields.forEach(k=>$(k).disabled=false);$('save-clip').disabled=false}}
$('clip-form').onsubmit=e=>{e.preventDefault();save()};$('save-copy').onclick=()=>save(true);$('new-clip').onclick=()=>{if(busy)return;if(dirty&&!confirm('放弃未保存的输入？'))return;++selectSeq;populate(null);notice('');refresh()};$('load-latest').onclick=()=>current&&select(current.id);
fields.forEach(k=>$(k).addEventListener('input',()=>{++selectSeq;dirty=true;count()}));
$('copy-clip').onclick=async()=>{try{await navigator.clipboard.writeText($('clip-text').value);notice('已复制到系统剪贴板')}catch{$('clip-text').focus();$('clip-text').select();notice('浏览器不允许自动复制，内容已选中，请手动复制。',true)}};
$('paste-clip').onclick=async()=>{if(busy)return;try{const text=await navigator.clipboard.readText();if(busy)return;$('clip-text').setRangeText(text,$('clip-text').selectionStart,$('clip-text').selectionEnd,'end');dirty=true;count();notice('已粘贴，点击保存即可同步。')}catch{notice('请长按输入框选择粘贴，或使用 Ctrl+V。',true);$('clip-text').focus()}};
$('delete-clip').onclick=async()=>{if(!current||busy||!confirm('删除此条内容？所有设备将同步删除。'))return;busy=true;try{await api('/'+current.id,'DELETE',{revision:current.revision});populate(null);notice('已删除');await refresh()}catch(e){notice(e.message,true)}finally{busy=false}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
})();
</script>
